name: Frozen integration review

on:
  push:
    branches: ["release/frozen-bom-review-v2"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  frozen-bom:
    name: Frozen package graph
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout frozen SharpClaw head
        uses: actions/checkout@v4
        with:
          repository: SharpClaw-NET/SharpClaw
          ref: release/storage-module-review-v2
          path: SharpClaw

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build frozen package graph
        working-directory: SharpClaw
        shell: pwsh
        env:
          PERSISTENCE_TOKEN: ${{ github.token }}
        run: |
          $credential = "x-access-token:$env:PERSISTENCE_TOKEN"
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($credential))
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/SharpClaw-NET/SharpClaw.Persistence.git.extraHeader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $authorization"

          ./build/BuildFrozenBom.ps1 -Root "${{ runner.temp }}\sharpclaw-frozen-bom"

      - name: Upload frozen package graph
        uses: actions/upload-artifact@v4
        with:
          name: sharpclaw-frozen-bom
          path: |
            ${{ runner.temp }}\sharpclaw-frozen-bom\feed\*.nupkg
            ${{ runner.temp }}\sharpclaw-frozen-bom\bundle\**\*
            ${{ runner.temp }}\sharpclaw-frozen-bom\bom-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
