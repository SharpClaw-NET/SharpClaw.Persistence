name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer: ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
      - run: dotnet restore SharpClaw.Persistence.slnx
      - name: Build
        run: dotnet build SharpClaw.Persistence.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }} -p:InformationalVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test SharpClaw.Persistence.slnx --configuration Release --no-build --no-restore
      - name: Pack immutable artifacts
        run: dotnet pack SharpClaw.Persistence.slnx --configuration Release --no-build --no-restore --output artifacts/packages -p:PackageVersion=${{ steps.version.outputs.value }} -p:Version=${{ steps.version.outputs.value }} -p:InformationalVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
      - name: Verify immutable package identity
        env:
          SHARPCLAW_PERSISTENCE_PACKAGE_ROOT: ${{ github.workspace }}/artifacts/packages
          SHARPCLAW_PERSISTENCE_PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          SHARPCLAW_PERSISTENCE_COMMIT: ${{ github.sha }}
        run: dotnet test SharpClaw.Persistence.Tests/SharpClaw.Persistence.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~PackageIdentityTests.PackedReleaseIdentityMatchesSourceAndReviewedCommit
      - name: Record package hashes
        shell: bash
        run: sha256sum artifacts/packages/*.nupkg | tee artifacts/packages.sha256
      - name: Publish to NuGet.org
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "${package}" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Publish identical artifacts to GitHub Packages
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "${package}" --api-key "${{ secrets.GITHUB_TOKEN }}" --source https://nuget.pkg.github.com/SharpClaw-NET/index.json --skip-duplicate
          done
      - uses: actions/upload-artifact@v4
        with:
          name: published-persistence-packages-${{ steps.version.outputs.value }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages.sha256
          if-no-files-found: error
